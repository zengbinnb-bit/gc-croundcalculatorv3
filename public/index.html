  SVGMap.prototype._fitToContainer = function() {

<div id="app">
  <div id="sidebar">
    <h1>谷仓美国Ground渠道运费分区地图与计算器</h1>
    <div id="sidebar-content">

      <!-- 产品热度搜索 -->
      <div class="panel">
        <div class="panel-title">产品热度搜索</div>
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="输入产品关键词（支持中英文，如 workbench / 工作台）" onkeypress="if(event.key==='Enter')searchProduct()">
          <button class="search-btn" id="searchBtn" onclick="searchProduct()">搜索</button>
        </div>
        <div id="searchResult"></div>
      </div>

      <!-- 渠道与仓库选择 -->
      <div class="panel">
        <div class="panel-title">渠道与仓库选择</div>
        <div class="input-label">选择Ground渠道</div>
        <select id="channelSelect">
          <option value="FedEx Ground">FedEx Ground</option>
          <option value="GC Ground">GC Ground</option>
          <option value="UPS Ground">UPS Ground</option>
          <option value="Amazon Ground">Amazon Ground</option>
        </select>
        <div class="input-label" style="margin-top:6px">选择始发仓库</div>
        <select id="warehouseSelect"></select>
        <div class="input-label" style="margin-top:6px">Zone筛选 (点击切换)</div>
        <div class="zone-filter" id="zoneFilter"></div>
      </div>

      <!-- 运费计算器 -->
      <div class="panel">
        <div class="panel-title">运费计算器</div>

        <!-- 重量 + 长宽高 同一行 -->
        <div class="input-row">
          <div><div class="input-label">实际重量 (kg)</div><input type="number" id="weight" value="2" min="0.1" step="0.1"></div>
          <div><div class="input-label">长 (cm)</div><input type="number" id="len" value="30" min="1" step="0.1"></div>
          <div><div class="input-label">宽 (cm)</div><input type="number" id="wid" value="20" min="1" step="0.1"></div>
          <div><div class="input-label">高 (cm)</div><input type="number" id="hei" value="15" min="1" step="0.1"></div>
        </div>

        <!-- 目标仓库 + 目标Zone 同一行 -->
        <div class="input-row">
          <div style="flex:2">
            <div class="input-label">目标仓库（可多选）</div>
            <div class="ms-wrapper">
              <div class="ms-header" onclick="toggleWhDropdown(event)">
                <span id="whSelectedText">请选择目标仓库</span>
                <span class="ms-arrow" id="msArrow">&#9662;</span>
              </div>
              <div class="ms-dropdown" id="whDropdown"></div>
            </div>
          </div>
          <div style="flex:1">
            <div class="input-label">目标Zone</div>
            <select id="targetZone"></select>
          </div>
        </div>

        <!-- 货件形式 + 货件数量 + 燃油费率 同一行 -->
        <div class="input-row">
          <div><div class="input-label">货件形式</div>
            <select id="shipmentForm">

/* ===== 工具函数 ===== */
function round2(v) { return Math.round(v * 100) / 100; }
function round3(v) { return Math.round(v * 1000) / 1000; }
function roundDim(val) { return Math.ceil(val / 2.54) * 2.54; }

function zoneMatch(zone, pattern) {
  const z = zone.replace('Zone ', '').replace('*', '').trim();
  if (pattern === 'Zones 7+' || pattern === 'Zone7+') return parseFloat(z) >= 7;
  const cleanPattern = pattern.replace(/Zone[s]?\s*/g, '').replace(/\s/g, '');
  if (cleanPattern.includes('-')) {
    const parts = cleanPattern.split('-');
    if (parts.length === 2) {
      const min = parseFloat(parts[0]), max = parseFloat(parts[1]);
      const zn = parseFloat(z);
      return !isNaN(min) && !isNaN(max) && !isNaN(zn) && zn >= min && zn <= max;
    }
  }
  return cleanPattern === z || cleanPattern.includes(z);
}

function getFeeForZone(zoneFeeMap, zone) {
  for (const [pattern, fee] of Object.entries(zoneFeeMap)) {
    if (zoneMatch(zone, pattern)) return fee;
  }
  return 0;
}

function getMaxWeightPrice(channel, weight, zone) {
  const prices = window.PRICE_DATA[channel];
  if (!prices || !prices.rows) return null;
  const zoneIdx = prices.headers ? prices.headers.indexOf(zone) : -1;
  if (zoneIdx < 0) return null;
  const priceCol = zoneIdx - 1;
  if (priceCol < 0) return null;
  const intWeight = Math.floor(weight);
  let bestMatch = null;
  for (let i = 0; i < prices.rows.length; i++) {
    const row = prices.rows[i];
    const w = row[0];
    if (w === 'per_kg' || (typeof w === 'string' && w.endsWith('+'))) break;
    if (typeof w === 'number') {
      const wInt = Math.floor(w);
      if (wInt === intWeight) bestMatch = row[priceCol];
      if (wInt > intWeight) break;
    }
  }
  return bestMatch;
}

/* 长尾关键词生成：基于主关键词衍生搜索变体 */
function generateLongTailKeywords(keyword) {
  var kw = keyword.toLowerCase().trim();
  var suffixes = ['buy', 'price', 'best', 'review', 'near me', 'online', 'cheap', 'quality', 'for sale', 'discount'];
  var prefixes = ['best', 'top', 'cheap', 'quality', 'professional', 'portable'];
  var variations = [kw];
  // 只生成少量变体用于交叉验证（避免过多API调用）
  for (var i = 0; i < 3; i++) {
    variations.push(kw + ' ' + suffixes[i]);
  }
  for (var j = 0; j < 2; j++) {
    variations.push(prefixes[j] + ' ' + kw);
  }
  return variations;
}

/* 区域关联词（仅用于实时搜索结果的文本分析，不作为基础权重） */
var REGION_ASSOCIATIONS = {
  Northeast: ['new york','nyc','boston','philadelphia','new jersey','pennsylvania','manhattan','brooklyn','connecticut','massachusetts','maine','vermont','new hampshire','rhode island','wall street','broadway','harvard','mit','yankee','liberty','times square','adirondack','catskill','appalachian trail maine'],

  South:     ['texas','dallas','houston','miami','atlanta','florida','georgia','virginia','nashville','tennessee','new orleans','charlotte','alabama','mississippi','louisiana','arkansas','kentucky','north carolina','south carolina','oklahoma','barbecue','bbq','country music','oil','gulf','everglades','big bend','smoky mountains','appalachian trail georgia'],

};

/* 从文本中分析区域热度（用于实时搜索交叉验证，不作为基础权重） */
function analyzeRegionFromText(text) {
  if (!text || text.length < 10) return null;
  var textLower = text.toLowerCase();
  var mentions = { Northeast: 0, Midwest: 0, South: 0, West: 0 };
  Object.keys(REGION_ASSOCIATIONS).forEach(function(region) {
    REGION_ASSOCIATIONS[region].forEach(function(rk) {
      var re = new RegExp('\\b' + rk.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
      var matches = (textLower.match(re) || []).length;
      mentions[region] += matches;
    });
  });
  var total = mentions.Northeast + mentions.Midwest + mentions.South + mentions.West;
  if (total < 2) return null; // 需要至少2次提及才有统计意义
  var heats = {};
  var maxVal = 0;
  Object.keys(mentions).forEach(function(r) {
    heats[r] = Math.round((mentions[r] / total) * 100);
    if (heats[r] > maxVal) maxVal = heats[r];
  });
  if (maxVal > 0) Object.keys(heats).forEach(function(r) { heats[r] = Math.round((heats[r] / maxVal) * 100); });
  return heats;
}

function getTopRegion(heats) {
  var top = '', maxVal = 0;
  Object.keys(heats).forEach(function(r) {
    if (heats[r] > maxVal) { maxVal = heats[r]; top = r; }
  });
  return top;
}

/* 实时交叉验证搜索：生成长尾词 → 多源搜索 → 交叉验证 → 按重复度确定热度 */
async function crossValidateSearch(keyword) {
  var variations = generateLongTailKeywords(keyword);
  var allText = '';
  var sourceCount = 0;
  var sourceNames = [];

  var apiErrors = [];
  // 数据源1: DuckDuckGo Instant Answer（对主关键词和前2个变体搜索）
  var ddgTexts = [];
  for (var i = 0; i < Math.min(variations.length, 3); i++) {
    var ddgResult = await fetchDuckDuckGo(variations[i]);
    if (ddgResult.data) {
      var ddg = ddgResult.data;
      if (ddg.AbstractText) ddgTexts.push(ddg.AbstractText);
      if (ddg.RelatedTopics) {
        ddg.RelatedTopics.forEach(function(t) {
          if (t.Text) ddgTexts.push(t.Text);
          if (t.Topics) t.Topics.forEach(function(sub) { if (sub.Text) ddgTexts.push(sub.Text); });
        });
      }
      sourceCount++;
    } else if (ddgResult.error) {
      apiErrors.push('DuckDuckGo: ' + ddgResult.error);
    }
  }
  if (ddgTexts.length > 0) {
    allText += ' ' + ddgTexts.join(' ').toLowerCase();
    sourceNames.push('DuckDuckGo (' + ddgTexts.length + '条相关)');
  }

  // 数据源2: Google Suggest（对主关键词搜索）
  var suggestResult = await fetchGoogleSuggest(keyword);
  var suggestText = '';
  if (suggestResult.data && suggestResult.data[1] && suggestResult.data[1].length > 0) {
    suggestText = suggestResult.data[1].join(' ').toLowerCase();
    allText += ' ' + suggestText;
    sourceNames.push('Google Suggest (' + suggestResult.data[1].length + '条建议)');
    sourceCount++;
  } else if (suggestResult.error) {
    apiErrors.push('Google Suggest: ' + suggestResult.error);
  }

  // 数据源3: Wikipedia
  var wikiResult = await fetchWikipediaPageviews(keyword);
  if (wikiResult.data && wikiResult.data.title) {
    allText += ' ' + wikiResult.data.title.toLowerCase();
    sourceNames.push('Wikipedia');
    sourceCount++;
  } else if (wikiResult.error) {
    apiErrors.push('Wikipedia: ' + wikiResult.error);
  }

  // 交叉验证：需要至少2个数据源返回结果
  if (sourceCount < 2) return { heats: null, errors: apiErrors };

  var heats = analyzeRegionFromText(allText);
  if (!heats) return { heats: null, errors: apiErrors, reason: '文本分析未找到足够的区域关键词' };

  return {
    heats: heats,
    sources: sourceNames.join(' + '),
    sourceCount: sourceCount,
    variations: variations.length,
    errors: apiErrors
  };
}

async function fetchWebSearchPopularity(keyword) {
  var query = 'In which of the four major U.S. regions is the keyword "' + keyword + '" most popular among users? Please rank the regions by popularity, from highest to lowest.';
  // DuckDuckGo Instant Answer（通过 /api/duckduckgo 代理）
  try {
    var resp = await fetch('/api/duckduckgo?query=' + encodeURIComponent(query), {
      signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined
    });
    if (resp.ok) {
      var data = await resp.json();
      var fullText = ((data.AbstractText || '') + ' ' + (data.RelatedTopics || []).map(function(t) {
        return (t.Text || '') + ' ' + ((t.Topics || []).map(function(s) { return s.Text || ''; }).join(' '));
      }).join(' ')).toLowerCase();
      var heats = analyzeRegionFromText(fullText);
      if (heats) return { heats: heats, source: 'DuckDuckGo Q&A' };
    }
  } catch(e) { /* continue */ }

  // Google Suggest（通过 /api/google-suggest 代理）
  try {
    var suggestResp = await fetch('/api/google-suggest?keyword=' + encodeURIComponent('"' + keyword + '" most popular US region'), {
      signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined
    });
    if (suggestResp.ok) {
      var suggestData = await suggestResp.json();
      if (suggestData && suggestData[1]) {
        var heats2 = analyzeRegionFromText(suggestData[1].join(' '));
        if (heats2) return { heats: heats2, source: 'Google Suggest (' + suggestData[1].length + '条)' };
      }
    }
  } catch(e) { /* fall through */ }

  return null;
}

function parseTrendsToRegions(trendsData) {
  if (!trendsData || !trendsData.default || !trendsData.default.geoMapData) return null;
  var geoMapData = trendsData.default.geoMapData;
  var regionSums = { 'Northeast': [], 'Midwest': [], 'South': [], 'West': [] };

  geoMapData.forEach(function(item) {
    var region = STATE_TO_REGION[item.geoCode];
    if (!region) return;
    var val = (item.value && item.value[0] !== null && item.value[0] !== undefined) ? item.value[0] : 0;
    if (val === null || val === undefined || isNaN(val)) val = 0;
    regionSums[region].push(val);
  });

  // 各区域取平均值，再归一化到 0-100
  var heats = {};
  var maxAvg = 0;
  Object.keys(regionSums).forEach(function(r) {
    var vals = regionSums[r];
    var avg = vals.length > 0 ? vals.reduce(function(a,b){return a+b;},0) / vals.length : 0;
    heats[r] = Math.round(avg);
    if (avg > maxAvg) maxAvg = avg;
  });
  if (maxAvg > 0) {
    Object.keys(heats).forEach(function(r) { heats[r] = Math.round((heats[r] / maxAvg) * 100); });
  }
  return heats;
}

function heatColor(value) {
  var ratio = Math.max(0, Math.min(1, value / 100));
  var r, g, b;
  if (ratio < 0.25) {
    var t = ratio / 0.25;
    r = Math.round(33 + (76 - 33) * t); g = Math.round(150 + (175 - 150) * t); b = Math.round(243 + (80 - 243) * t);
  } else if (ratio < 0.5) {
    var t2 = (ratio - 0.25) / 0.25;
    r = Math.round(76 + (255 - 76) * t2); g = Math.round(175 + (235 - 175) * t2); b = Math.round(80 + (59 - 80) * t2);
  } else if (ratio < 0.75) {
    var t3 = (ratio - 0.5) / 0.25;
    r = 255; g = Math.round(235 + (152 - 235) * t3); b = Math.round(59 + (0 - 59) * t3);
  } else {
    var t4 = (ratio - 0.75) / 0.25;
    r = 255; g = Math.round(152 + (67 - 152) * t4); b = Math.round(0 + (54 - 0) * t4);
  }
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ===== 仓储费计算 ===== */
function getWeightBasedFee(feeData, weight, whCol) {
  var tiers = feeData.tiers;
  for (var i = 0; i < tiers.length; i++) {
    if (weight <= tiers[i].max) return tiers[i].fees[whCol];
  }
  // weight > 40
  var lastTier = tiers[tiers.length - 1];
  var baseFee = lastTier.fees[whCol];
  var overRate = feeData.over40Rate[whCol];
  return round2(baseFee + overRate * (weight - 40));
}

function calculateWarehouseFees(weight, len, wid, hei) {
  var form = document.getElementById('shipmentForm').value;
  var qty = parseFloat(document.getElementById('shipmentQty').value) || 0;
  var warehouses = Array.from(selectedTargetWarehouses);

  if (warehouses.length === 0) return null;

  var results = [];
  warehouses.forEach(function(whKey) {
    var whCol = window.WAREHOUSE_FEES.warehouseMap[whKey];
    if (!whCol) {
      results.push({ warehouse: whKey, whName: window.WAREHOUSES[whKey].name, noData: true });
      return;
    }

    // 卸货费（散货享8折优惠）
    var unloadingFee = 0;
    var unloadingDetail = '';
    if (form === '散货') {
      var cbm = (len * wid * hei) / 1000000;
      var rate = window.WAREHOUSE_FEES.unloading['散货'][whCol];
      unloadingFee = round3(rate * cbm * 0.8);
      unloadingDetail = rate + ' × ' + cbm.toFixed(4) + ' CBM × 0.8(8折)';
    } else {
      var fee = window.WAREHOUSE_FEES.unloading[form][whCol];
      if (qty > 0) {
        unloadingFee = round3(fee / qty);
        unloadingDetail = fee + ' / ' + qty;
      } else {
        unloadingFee = 0;
        unloadingDetail = fee + ' / (数量为0)';
      }
    }

    // 收货上架费（7.5折优惠）
    var shelvingFee = getWeightBasedFee(window.WAREHOUSE_FEES.shelving, weight, whCol) * 0.75;

    // 出库费（7.5折优惠）
    var outboundFee = getWeightBasedFee(window.WAREHOUSE_FEES.outbound, weight, whCol) * 0.75;

    var total = round3(unloadingFee + shelvingFee + outboundFee);

    results.push({
      warehouse: whKey,
      whName: window.WAREHOUSES[whKey].name,
      unloadingFee: unloadingFee,
      unloadingDetail: unloadingDetail,
      shelvingFee: round3(shelvingFee),
      outboundFee: round3(outboundFee),
      total: total,
      form: form
    });
  });

  return results;
}

  });

  if (hasData) {
    html += '<div class="wh-fee-total"><span>仓储费总额/件</span><span class="wh-fee-val">$' + round3(grandTotal).toFixed(3) + '</span></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ===== 运费计算（主函数） ===== */
function calculate() {
  var len = parseFloat(document.getElementById('len').value) || 0;
  var wid = parseFloat(document.getElementById('wid').value) || 0;
  var hei = parseFloat(document.getElementById('hei').value) || 0;
  var actualWeight = parseFloat(document.getElementById('weight').value) || 0;
  var zone = document.getElementById('targetZone').value;
  var fuelRateInput = document.getElementById('fuelRate').value;
  var fuelRate = (parseFloat(fuelRateInput) || 0) / 100;
  var peakChecked = document.getElementById('peakSurchargeCheck').checked;
  var residentialPeakChecked = document.getElementById('residentialPeakCheck').checked;
  var remoteChecked = document.getElementById('remoteCheck').checked;

  // 计算仓储费（上部分）
  var rawWeight = actualWeight;
  var rawLen = len, rawWid = wid, rawHei = hei;
  var whResults = calculateWarehouseFees(rawWeight, rawLen, rawWid, rawHei);
  renderWarehouseFeeResult(whResults);

  // 以下是原有运费计算逻辑
  len = roundDim(len);
  wid = roundDim(wid);
  hei = roundDim(hei);
  actualWeight = round2(actualWeight);

  var rule = window.SURCHARGE_RULES[currentChannel];
  var dimWeight = round2((len * wid * hei) / rule.dimDivisor);
  var chargeWeight = round2(Math.max(actualWeight, dimWeight));

  var sides = [len, wid, hei].sort(function(a, b) { return b - a; });
  var longest = sides[0];
  var secondLongest = sides[1];
  var thirdLongest = sides[2];
  var girth = longest + 2 * secondLongest + 2 * thirdLongest;
  var volume = len * wid * hei;

  var triggeredOverweight = false;
  var triggeredOversize = false;
  var triggeredIrregular = false;
  var triggeredNonStandard = false;
  var triggeredOversizeLarge = false;
  var triggeredUnshippable = false;

  // 解析Zone编号用于分区判断
  var zoneNum = parseInt((zone || '').replace(/[^0-9]/g, '')) || 0;

  if (currentChannel === 'Amazon Ground') {
    // Amazon Ground 渠道触发条件（按"Amazon Ground-价格表"计费说明）
    // 额外处理费-超重费：④包裹实重超22.67KG
    if (actualWeight >= 22.67) triggeredOverweight = true;
    // 额外处理费-超长费：①最长边超过119.38CM ②次长边超过106.68CM ③girth大于266.7CM
    if (longest >= 119.38 || secondLongest >= 106.68 || girth >= 266.7) triggeredOversize = true;
    // 额外处理费-Non-Standard：①最长边超过93.98CM ②次长边超过76.2CM ③最短边大于60.96CM
    if (longest >= 93.98 || secondLongest >= 76.2 || thirdLongest >= 60.96) triggeredNonStandard = true;
    // 超长超大费-不可发：①最长边超过243.84CM ②girth超过330.2CM
    if (longest >= 243.84 || girth >= 330.2) triggeredOversizeLarge = true;
    // 超长费-不可发：①重量超过67.5KG ②最长边超过274.32CM ③girth超过419.1CM
    if (actualWeight >= 67.5 || longest >= 274.32 || girth >= 419.1) triggeredUnshippable = true;
  } else if (currentChannel === 'GC Ground') {
    // GC Ground 渠道触发条件（按"GC Ground-价格表"计费说明）
    // 额外处理费-超重费：实际重量超过22.5KG
    if (actualWeight >= 22.5) triggeredOverweight = true;
    // 额外处理费-超长附加费：①最长边超过121.92CM但≤243.84CM ②次长边超过76.2CM ③girth>266.7CM
    // ④仅针对Zone8~Zone14区生效：体积>169901.08CM³（2026年1月12日生效）
    if (longest >= 121.92 && longest <= 243.84) triggeredOversize = true;
    if (secondLongest >= 76.2) triggeredOversize = true;
    if (girth >= 266.7) triggeredOversize = true;
    if (zoneNum >= 8 && zoneNum <= 14 && volume > 169901.08) triggeredOversize = true;
    // 超长超大费-商业/住宅
    if (longest >= 243.84) triggeredOversizeLarge = true;
    if (girth >= 330.2) triggeredOversizeLarge = true;
    if (volume > 283168.47) triggeredOversizeLarge = true;
    if (actualWeight >= 49.83 && actualWeight <= 67.5) triggeredOversizeLarge = true;
    if (actualWeight >= 67.5) triggeredUnshippable = true;
    if (longest >= 274.32) triggeredUnshippable = true;
    if (girth >= 419.1) triggeredUnshippable = true;
  } else if (currentChannel === 'FedEx Ground') {
    // FedEx Ground 渠道触发条件（按"FedEx Ground-价格表"计费说明）
    // 额外处理费-超重费：实际重量超过22.5KG
    if (actualWeight >= 22.5) triggeredOverweight = true;
    // 额外处理费-超长附加费：①最长边超过121.92CM但≤243.84CM ②次长边超过76.2CM ③girth>266.7CM ④体积>169901.08CM³（全分区）
    if (longest >= 121.92 && longest <= 243.84) triggeredOversize = true;
    if (secondLongest >= 76.2) triggeredOversize = true;
    if (girth >= 266.7) triggeredOversize = true;
    if (volume > 169901.08) triggeredOversize = true;
    // 超长超大费
    if (longest >= 243.84) triggeredOversizeLarge = true;
    if (girth >= 330.2) triggeredOversizeLarge = true;
    if (volume > 283168.47) triggeredOversizeLarge = true;
    if (actualWeight >= 49.83 && actualWeight <= 67.5) triggeredOversizeLarge = true;
    if (actualWeight >= 67.5) triggeredUnshippable = true;
    if (longest >= 274.32) triggeredUnshippable = true;
    if (girth >= 419.1) triggeredUnshippable = true;
  } else if (currentChannel === 'UPS Ground') {
    // UPS Ground 渠道触发条件（按"UPS Ground-价格表"计费说明，2026年01月26日后生效版本）
    // 额外处理费-超重费：实际重量超过22.5KG
    if (actualWeight >= 22.5) triggeredOverweight = true;
    // 额外处理费-超长附加费：①最长边>121.92CM但≤243.84CM ②次长边>76.2CM ③girth>266.7CM ④体积>169901.08CM³（全分区）
    if (longest >= 121.92 && longest <= 243.84) triggeredOversize = true;
    if (secondLongest >= 76.2) triggeredOversize = true;
    if (girth >= 266.7) triggeredOversize = true;
    if (volume > 169901.08) triggeredOversize = true;
    // 超长超大费
    if (longest >= 243.84) triggeredOversizeLarge = true;
    if (girth >= 330.2) triggeredOversizeLarge = true;
    if (volume > 283168.47) triggeredOversizeLarge = true;
    if (actualWeight >= 49.83 && actualWeight <= 67.5) triggeredOversizeLarge = true;
    if (actualWeight >= 67.5) triggeredUnshippable = true;
    if (longest >= 274.32) triggeredUnshippable = true;
    if (girth >= 419.1) triggeredUnshippable = true;
  }

  var peakRow = document.getElementById('peakRow');
  var peakHint = document.getElementById('peakHint');
  var peakCheck = document.getElementById('peakSurchargeCheck');
  if (triggeredOversizeLarge || triggeredOversize || triggeredOverweight || triggeredIrregular || triggeredNonStandard) {
    peakCheck.disabled = false;
    peakRow.classList.remove('disabled');
    var periodText = '';
    if (triggeredOversizeLarge && rule.peakOversize) {
      periodText = '超长超大费旺季: ' + rule.peakOversize.periods.join(', ');
    } else if ((triggeredOversize || triggeredOverweight || triggeredIrregular || triggeredNonStandard) && rule.peakExtraHandling) {
      periodText = '额外处理费旺季: ' + rule.peakExtraHandling.periods.join(', ');
    }
    peakHint.textContent = periodText;
  } else {
    peakCheck.disabled = true;
    peakCheck.checked = false;
    peakRow.classList.add('disabled');
    peakHint.textContent = '无触发的额外处理费或超长超大费，旺季附加费不可用';
  }

  var basePrice = getMaxWeightPrice(currentChannel, chargeWeight, zone);
  if (basePrice === null || typeof basePrice !== 'number') basePrice = 0;

  var warnings = [];
  var extraHandlingFee = 0;
  var oversizeFee = 0;
  var peakFee = 0;
  var residentialFee = 0;
  var remoteFee = 0;
  var peakSurchargeFee = 0;
  var warningText = '';

  if (triggeredUnshippable) {
    warnings.push({ type: 'danger', text: '\u26a0\ufe0f 货件超出渠道服务范围（超长/超重/超围长），不可发！' });
  }

  if (currentChannel === 'Amazon Ground') {
    var ehFees = [];
    if (triggeredNonStandard) ehFees.push(getFeeForZone(rule.extraHandling.nonStandard, zone));
    if (triggeredOverweight) ehFees.push(getFeeForZone(rule.extraHandling.overweight, zone));
    if (triggeredOversize) ehFees.push(getFeeForZone(rule.extraHandling.oversizeLength, zone));
    if (ehFees.length > 0) {
      extraHandlingFee = Math.max.apply(null, ehFees);
      warningText = '\ud83d\udce6 触发 Amazon 额外处理费 $' + extraHandlingFee.toFixed(2) + '/包裹 (取最大值，不叠加)';
      warnings.push({ type: 'warning', text: warningText });
    }
    if (peakChecked && rule.peakExtraHandling) {
      peakFee = round2(rule.peakExtraHandling.values.reduce(function(a, b) { return a + b; }, 0) / rule.peakExtraHandling.values.length);
    }
    if (rule.peakSurcharge) {
      peakSurchargeFee = round2(rule.peakSurcharge.values.reduce(function(a, b) { return a + b; }, 0) / rule.peakSurcharge.values.length);
    }
  } else {
    var ehFees2 = [];
    if (triggeredOverweight) ehFees2.push(getFeeForZone(rule.extraHandling.overweight, zone));
    if (triggeredOversize) ehFees2.push(getFeeForZone(rule.extraHandling.oversize, zone));
    if (triggeredIrregular) ehFees2.push(getFeeForZone(rule.extraHandling.irregular, zone));
    if (ehFees2.length > 0) {
      extraHandlingFee = Math.max.apply(null, ehFees2);
    }

    if (triggeredOversizeLarge && rule.oversize && rule.oversize.residential) {
      oversizeFee = getFeeForZone(rule.oversize.residential, zone);
      extraHandlingFee = 0;
      warningText = '\ud83d\udce6 触发 超长超大费-住宅 $' + oversizeFee.toFixed(2) + '/包裹（不再收取额外处理费）';
      warnings.push({ type: 'warning', text: warningText });
    } else if (extraHandlingFee > 0) {
      warningText = '\ud83d\udce6 触发 额外处理费 $' + extraHandlingFee.toFixed(2) + '/包裹 (取最大值，不叠加)';
      warnings.push({ type: 'warning', text: warningText });
    }

    if (peakChecked) {
      if (oversizeFee > 0 && rule.peakOversize) {
        var vals = rule.peakOversize.values;
        var pof = 0;
        if (rule.peakOversize.zoneSplit) {
          var isHigh = rule.peakOversize.highZones.some(function(hz) { return zoneMatch(zone, hz.replace('Zone', '')); });
          pof = isHigh ? vals.slice(1).reduce(function(a, b) { return a + b; }, 0) / (vals.length - 1) : vals[0];
        } else {
          pof = vals.reduce(function(a, b) { return a + b; }, 0) / vals.length;
        }
        peakFee = round2(pof);
      } else if (extraHandlingFee > 0 && rule.peakExtraHandling) {
        var vals2 = rule.peakExtraHandling.values;
        var pef = 0;
        if (rule.peakExtraHandling.zoneSplit) {
          var isHigh2 = rule.peakExtraHandling.highZones.some(function(hz) { return zoneMatch(zone, hz.replace('Zone', '')); });
          pef = isHigh2 ? vals2.slice(1).reduce(function(a, b) { return a + b; }, 0) / (vals2.length - 1) : vals2[0];
        } else {
          pef = vals2.reduce(function(a, b) { return a + b; }, 0) / vals2.length;
        }
        peakFee = round2(pef);
      }
    }

    residentialFee = rule.residential.base;
    if (residentialPeakChecked) {
      var peakRes = rule.residential.peak;
      if (rule.residential.zoneSplit) {
        var isHighR = rule.residential.highZones.some(function(hz) { return zoneMatch(zone, hz.replace('Zone', '')); });
        if (!isHighR) peakRes = 0;
      }
      residentialFee = round2(residentialFee + peakRes);
    }

    if (remoteChecked && rule.remote) {
      var avg = (rule.remote.remoteRes + rule.remote.extendedRes) / 2;
      remoteFee = round2(avg * 0.30);
    }
  }

  var surchargeSubtotal = round2(extraHandlingFee + oversizeFee + peakFee + residentialFee + remoteFee + peakSurchargeFee);
  var subtotal = round2(basePrice + surchargeSubtotal);
  var total = round2(subtotal * (1 + fuelRate));
  var fuelFee = round2(total - subtotal);

  var html = '<div class="ship-fee-box">';
  html += '<div class="ship-fee-title">运费计算结果</div>';

  // 货件信息组
  html += '<div class="ship-fee-group">';
  html += '<div class="ship-fee-group-title">货件信息</div>';
  html += '<div class="ship-fee-line"><span>进位后尺寸</span><span class="ship-fee-val">长' + len.toFixed(2) + ' 宽' + wid.toFixed(2) + ' 高' + hei.toFixed(2) + ' cm</span></div>';
  html += '<div class="ship-fee-line"><span>体积重</span><span class="ship-fee-val">' + dimWeight.toFixed(2) + ' kg (系数' + rule.dimDivisor + ')</span></div>';
  html += '<div class="ship-fee-line"><span>计费重</span><span class="ship-fee-val">' + chargeWeight.toFixed(2) + ' kg</span></div>';
  html += '</div>';

  // 费用明细组
  html += '<div class="ship-fee-group">';
  html += '<div class="ship-fee-group-title">费用明细 (' + currentChannel + ' · ' + zone + ')</div>';
  html += '<div class="ship-fee-line"><span>基础运费</span><span class="ship-fee-val">$' + basePrice.toFixed(2) + '</span></div>';
  if (extraHandlingFee > 0) html += '<div class="ship-fee-line"><span>附加费-额外处理费</span><span class="ship-fee-val">$' + extraHandlingFee.toFixed(2) + '</span></div>';
  if (oversizeFee > 0) html += '<div class="ship-fee-line"><span>附加费-超长超大费</span><span class="ship-fee-val">$' + oversizeFee.toFixed(2) + '</span></div>';
  if (peakFee > 0) html += '<div class="ship-fee-line"><span>附加费-旺季附加费</span><span class="ship-fee-val">$' + peakFee.toFixed(2) + '</span></div>';
  if (peakSurchargeFee > 0) html += '<div class="ship-fee-line"><span>附加费-旺季 surcharge</span><span class="ship-fee-val">$' + peakSurchargeFee.toFixed(2) + '</span></div>';
  if (residentialFee > 0) html += '<div class="ship-fee-line"><span>附加费-住宅派送费</span><span class="ship-fee-val">$' + residentialFee.toFixed(2) + '</span></div>';
  if (remoteFee > 0) html += '<div class="ship-fee-line"><span>附加费-偏远/超偏远费</span><span class="ship-fee-val">$' + remoteFee.toFixed(2) + '</span></div>';
  if (rule.fuelSurcharge) {
    html += '<div class="ship-fee-line"><span>燃油附加费</span><span class="ship-fee-val">$' + fuelFee.toFixed(2) + ' (费率' + fuelRateInput + '%)</span></div>';
    html += '<div class="ship-fee-calc">计算: (' + basePrice.toFixed(2) + '+' + surchargeSubtotal.toFixed(2) + ')×' + fuelRateInput + '%</div>';
  }
  html += '</div>';

  html += '<div class="ship-fee-total"><span>预估总运费/件</span><span class="ship-fee-val">$' + total.toFixed(2) + '</span></div>';
  html += '</div>';

  if (warnings.length > 0) {
    html += '<div style="margin-top:6px">';
    warnings.forEach(function(w) { html += '<div class="warning-box ' + w.type + '">' + w.text + '</div>'; });
    html += '</div>';
  }

  document.getElementById('calcResult').innerHTML = html;
}

/* ===== 事件监听 ===== */
document.getElementById('channelSelect').addEventListener('change', function(e) {
  currentChannel = e.target.value;
  updateWarehouseOptions();
  var zd = window.ZONE_DATA;
  var zones = zd && zd[currentChannel] && zd[currentChannel][currentWarehouse] ? Object.keys(zd[currentChannel][currentWarehouse]) : [];
  activeZones = new Set(zones);
  renderZoneFilter(zones);
  renderMarkers();
  updateTargetZoneOptions();
  var rule = window.SURCHARGE_RULES[currentChannel];
  document.getElementById('formulaNote').textContent = rule ? rule.formula : '';
  var resHint = document.getElementById('residentialHint');
  if (rule && rule.residential.peakPeriod) {
    resHint.textContent = '住宅派送费默认收取，勾选"是否旺季"额外加收旺季住宅派送费 (' + rule.residential.peakPeriod + ')';
  }
});

document.getElementById('warehouseSelect').addEventListener('change', function(e) {
  currentWarehouse = e.target.value;
  updateTargetZoneOptions();
  var zd = window.ZONE_DATA;
  var zones = zd && zd[currentChannel] && zd[currentChannel][currentWarehouse] ? Object.keys(zd[currentChannel][currentWarehouse]) : [];
  activeZones = new Set(zones);
  renderZoneFilter(zones);
  renderMarkers();
});

/* ===== 初始化 ===== */
initMap();
updateWarehouseOptions();
renderTargetWarehouseDropdown();

function onDataReady() {
  var zd = window.ZONE_DATA;
  var zones = zd && zd[currentChannel] && zd[currentChannel][currentWarehouse] ? Object.keys(zd[currentChannel][currentWarehouse]) : [];
  activeZones = new Set(zones);
  renderZoneFilter(zones);
  renderMarkers();
  updateTargetZoneOptions();
  var rule = window.SURCHARGE_RULES[currentChannel];
  document.getElementById('formulaNote').textContent = rule ? rule.formula : '';
  if (rule && rule.residential.peakPeriod) {
    document.getElementById('residentialHint').textContent = '住宅派送费默认收取，勾选"是否旺季"额外加收旺季住宅派送费 (' + rule.residential.peakPeriod + ')';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() { setTimeout(onDataReady, 300); });
} else {
  setTimeout(onDataReady, 300);
}
